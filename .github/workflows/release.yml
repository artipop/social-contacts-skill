# Builds the skill archive for every platform and publishes it as a release:
# one folder holding SKILL.md, the social-contacts binary and the license.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # The binary is pure Go, so every target cross-compiles from one runner. The
  # macOS ones are built on macOS only because they are signed there.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          name="social-contacts-$GOOS-$GOARCH"
          exe=social-contacts
          if [ "$GOOS" = windows ]; then exe=social-contacts.exe; fi
          mkdir -p "stage/$name/social-contacts" dist
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "stage/$name/social-contacts/$exe" ./cmd/social-contacts
          cp skill/SKILL.md LICENSE "stage/$name/social-contacts/"
          if [ "$GOOS" = windows ]; then
            (cd "stage/$name" && zip -qr "../../dist/$name.zip" social-contacts)
          else
            tar -C "stage/$name" -czf "dist/$name.tar.gz" social-contacts
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: skill-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "bin/social-contacts-darwin-$arch" ./cmd/social-contacts
          done

      # A Developer ID signature when the certificate is configured, ad-hoc
      # otherwise. Ad-hoc runs locally but a downloaded copy is quarantined by
      # Gatekeeper.
      - name: Sign
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::APPLE_CERT_P12 is not set: signing ad-hoc, macOS will quarantine the download"
            for f in bin/social-contacts-darwin-*; do codesign --force --sign - --timestamp=none "$f"; done
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" >/dev/null
          # Word splitting is intended: one argument per existing keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          for f in bin/social-contacts-darwin-*; do
            codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$f"
          done
          rm -f "$RUNNER_TEMP/cert.p12"

      # Notarization is what clears Gatekeeper for a download. A bare
      # executable cannot be stapled, so Gatekeeper checks the ticket online.
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ]; then
            echo "::warning::APPLE_ID is not set: not notarized, users will need xattr -d com.apple.quarantine"
            exit 0
          fi
          for f in bin/social-contacts-darwin-*; do
            ditto -c -k --keepParent "$f" "$f.zip"
            xcrun notarytool submit "$f.zip" --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            rm -f "$f.zip"
          done

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 amd64; do
            name="social-contacts-darwin-$arch"
            mkdir -p "stage/$name/social-contacts"
            cp "bin/$name" "stage/$name/social-contacts/social-contacts"
            cp skill/SKILL.md LICENSE "stage/$name/social-contacts/"
            tar -C "stage/$name" -czf "dist/$name.tar.gz" social-contacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: skill-macos
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: skill-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
